name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify browser executable
        run: |
          find ~/.cache/ms-playwright -path '*/chrome-linux/chrome' -type f -perm /111

      - name: Run tests
        run: |
          pytest --alluredir=allure-results --clean-alluredir

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    # Always build Allure report even when `test` has failures, so that
    # failing tests (incl. intentionally-broken demo tests) still appear in
    # the published report.
    if: always() && github.event_name == 'push'
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results
        if: always()
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: allure-results

      - name: Install Node + Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - if: always()
        run: npm install -g allure-commandline --unsafe-perm=true

      - name: Generate static report
        if: always()
        run: allure generate allure-results -o allure-report --clean || echo "::warning::Allure generation failed or produced empty output"

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push' && hashFiles('allure-report/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./allure-report
